name: Build Eaglercraft 1.8 workspace baseline

on:
  push:
    branches:
      - aether-integration-prep
    paths:
      - ".github/workflows/aether-baseline-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout EaglercraftX workspace
        uses: actions/checkout@v4
        with:
          repository: Eaglercraft-Archive/EaglercraftX-1_8-workspace
          ref: main
          path: workspace

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: workspace/**/gradle.lockfile

      - name: Build offline JavaScript client
        working-directory: workspace
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace target_teavm_javascript:makeMainOfflineDownload

      - name: Upload baseline offline client
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-1.8-offline-baseline
          path: workspace/javascript/
          if-no-files-found: error
          retention-days: 7
